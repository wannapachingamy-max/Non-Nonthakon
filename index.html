<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการชำระเงิน - NonNon Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kanit & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Prompt', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            blue: '#e0f2fe',
                            sky: '#bae6fd',
                            deep: '#0284c7',
                            dark: '#0369a1',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col min-h-screen relative selection:bg-sky-200">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-200%] transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i class="fa-solid fa-circle-check text-sky-400 text-lg"></i>
        <span id="toast-message">คัดลอกสำเร็จแล้วค่ะ!</span>
    </div>

    <!-- Header / Top Section -->
    <header class="w-full max-w-md mx-auto pt-8 pb-4 px-4 text-center relative">
        <!-- Admin Access Button -->
        <button onclick="toggleAdminModal()" class="absolute top-6 right-4 bg-white/80 hover:bg-white text-slate-500 hover:text-sky-600 p-2.5 rounded-full shadow-md transition-all duration-200 border border-sky-100 flex items-center justify-center text-sm" title="จัดการหลังบ้าน">
            <i class="fa-solid fa-gear"></i>
        </button>

        <!-- Store Logo / Image Placeholder -->
        <div class="relative w-28 h-28 mx-auto mb-4 float-animation">
            <div class="absolute inset-0 bg-gradient-to-tr from-sky-400 to-blue-500 rounded-full blur-md opacity-50"></div>
            <img id="store-logo" src="https://placehold.co/200x200/bae6fd/0369a1?text=NonNon" alt="Store Logo" class="relative w-28 h-28 rounded-full object-cover border-4 border-white shadow-lg mx-auto" onerror="this.src='https://placehold.co/200x200/bae6fd/0369a1?text=NonNon'">
        </div>

        <h1 id="store-name" class="text-2xl font-bold text-slate-800 tracking-wide">NonNon Store</h1>
        <p id="store-subtitle" class="text-sm text-sky-700 font-medium mt-1">✨ รวมช่องทางชำระเงิน สะดวก ปลอดภัย ✨</p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md mx-auto px-4 flex-grow pb-12">
        <!-- Payment Channels Container -->
        <div id="payment-list" class="space-y-4">
            <!-- Dynamically populated via JavaScript -->
        </div>

        <!-- Contact / Social Links Section -->
        <div class="mt-8 pt-6 border-t border-sky-200/60 text-center">
            <p class="text-xs text-slate-500 font-medium mb-3">💬 ช่องทางติดต่อสอบถามร้านค้า</p>
            <div class="flex justify-center items-center space-x-4">
                <a href="https://lin.ee/NNKqu9g" target="_blank" class="w-12 h-12 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-md hover:scale-105 transition-all text-xl" title="Line">
                    <i class="fa-brands fa-line"></i>
                </a>
                <a href="https://www.facebook.com/share/19fLAacTiP/" target="_blank" class="w-12 h-12 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md hover:scale-105 transition-all text-xl" title="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/nonnon_store06?stkn=MXV2ZHJhdGF6MHF1aQ==" target="_blank" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 hover:opacity-90 text-white flex items-center justify-center shadow-md hover:scale-105 transition-all text-xl" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Admin Modal Panel -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 border border-sky-100 flex flex-col">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-sky-100 text-sky-600 p-2 rounded-xl">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">ระบบหลังบ้าน (Admin Panel)</h2>
                </div>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-full">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Store Info Settings -->
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                <h3 class="text-sm font-semibold text-slate-700 mb-3"><i class="fa-solid fa-store mr-1.5 text-sky-500"></i> ตั้งค่าร้านค้า</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อร้านค้า</label>
                        <input type="text" id="admin-store-name" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">คำโปรย / สโลแกน</label>
                        <input type="text" id="admin-store-subtitle" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ลิงก์รูปโลโก้ร้าน (URL)</label>
                        <input type="text" id="admin-store-logo" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                    </div>
                    <button onclick="saveStoreInfo()" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-medium transition-all shadow-sm">
                        บันทึกข้อมูลร้านค้า
                    </button>
                </div>
            </div>

            <!-- Add / Edit Payment Method Form -->
            <div class="bg-sky-50/60 p-4 rounded-2xl mb-6 border border-sky-100">
                <h3 id="form-title" class="text-sm font-semibold text-sky-900 mb-3"><i class="fa-solid fa-circle-plus mr-1.5 text-sky-600"></i> เพิ่มช่องทางชำระเงินใหม่</h3>
                <input type="hidden" id="edit-index" value="-1">
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อธนาคาร / แอป</label>
                            <input type="text" id="pay-name" placeholder="เช่น กสิกรไทย" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">ลิงก์รูปโลโก้ธนาคาร (URL)</label>
                            <input type="text" id="pay-icon" placeholder="https://... (URL รูปภาพ)" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อบัญชี</label>
                            <input type="text" id="pay-acc-name" placeholder="นาย นนท์ นนท์" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">เลขบัญชี / เบอร์โทร</label>
                            <input type="text" id="pay-acc-num" placeholder="123-4-56789-0" class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button onclick="savePaymentMethod()" class="py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-medium transition-all shadow-md flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-check"></i>
                            <span id="save-btn-text">บันทึกช่องทางนี้</span>
                        </button>
                        <button onclick="resetForm()" class="py-2.5 bg-white hover:bg-slate-100 text-slate-600 rounded-xl text-xs font-medium transition-all border border-slate-200">
                            ล้างฟอร์ม / ยกเลิก
                        </button>
                    </div>
                </div>
            </div>

            <!-- Existing Channels Management List -->
            <div>
                <h3 class="text-sm font-semibold text-slate-700 mb-3"><i class="fa-solid fa-list-check mr-1.5 text-sky-500"></i> รายการช่องทางทั้งหมด</h3>
                <div id="admin-payment-list" class="space-y-2.5 max-h-48 overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
                <button onclick="resetToDefaultData()" class="text-xs text-rose-500 hover:text-rose-700 font-medium underline">
                    รีเซ็ตเป็นค่าเริ่มต้น
                </button>
                <button onclick="toggleAdminModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-medium transition-all">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <script>
        // Default initial data with reliable bank/wallet logo URLs
        const defaultStoreInfo = {
            name: "NonNon Store",
            subtitle: "✨ รวมช่องทางชำระเงิน สะดวก ปลอดภัย ✨",
            logo: "https://placehold.co/200x200/bae6fd/0369a1?text=NonNon"
        };

        const defaultPaymentMethods = [
            {
                name: "ธนาคารกสิกรไทย (KBANK)",
                icon: "https://images.seeklogo.com/logo-png/52/2/kasikornbank-k-bank-logo-png_seeklogo-526435.png",
                accountName: "นาย นนทวัฒน์ ใจดี",
                accountNumber: "123-4-56789-0",
                active: true
            },
            {
                name: "TrueMoney Wallet",
                icon: "https://images.seeklogo.com/logo-png/44/1/truemoney-wallet-logo-png_seeklogo-446755.png",
                accountName: "นาย นนทวัฒน์ ใจดี",
                accountNumber: "089-123-4567",
                active: true
            },
            {
                name: "ธนาคารไทยพาณิชย์ (SCB)",
                icon: "https://images.seeklogo.com/logo-png/43/1/siam-commercial-bank-scb-logo-png_seeklogo-434032.png",
                accountName: "นาย นนทวัฒน์ ใจดี",
                accountNumber: "987-6-54321-0",
                active: true
            }
        ];

        // Load data from localStorage or defaults
        let storeInfo = JSON.parse(localStorage.getItem('nonnon_store_info')) || defaultStoreInfo;
        let paymentMethods = JSON.parse(localStorage.getItem('nonnon_payment_methods')) || defaultPaymentMethods;

        // Initialize application on load
        window.onload = function() {
            renderStoreInfo();
            renderFrontPaymentList();
            renderAdminPaymentList();
        };

        function renderStoreInfo() {
            document.getElementById('store-name').innerText = storeInfo.name;
            document.getElementById('store-subtitle').innerText = storeInfo.subtitle;
            document.getElementById('store-logo').src = storeInfo.logo;
            
            // Populate admin inputs
            document.getElementById('admin-store-name').value = storeInfo.name;
            document.getElementById('admin-store-subtitle').value = storeInfo.subtitle;
            document.getElementById('admin-store-logo').value = storeInfo.logo;
        }

        function saveStoreInfo() {
            storeInfo.name = document.getElementById('admin-store-name').value || "NonNon Store";
            storeInfo.subtitle = document.getElementById('admin-store-subtitle').value || "";
            storeInfo.logo = document.getElementById('admin-store-logo').value || "https://placehold.co/200x200/bae6fd/0369a1?text=Logo";
            
            localStorage.setItem('nonnon_store_info', JSON.stringify(storeInfo));
            renderStoreInfo();
            showToast("บันทึกข้อมูลร้านค้าเรียบร้อยแล้วค่ะ! ✨");
        }

        // Render Front-end Payment Cards with Image Logos
        function renderFrontPaymentList() {
            const container = document.getElementById('payment-list');
            container.innerHTML = '';

            const activeMethods = paymentMethods.filter(item => item.active);

            if (activeMethods.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-3xl p-8 text-center shadow-lg border border-white">
                        <div class="text-4xl text-sky-300 mb-3"><i class="fa-solid fa-mug-hot"></i></div>
                        <p class="text-slate-500 text-sm">ยังไม่มีช่องทางการชำระเงินที่เปิดใช้งานในขณะนี้ค่ะ</p>
                    </div>
                `;
                return;
            }

            activeMethods.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-3xl p-5 shadow-xl hover:shadow-2xl transition-all duration-300 border border-white/80 relative overflow-hidden group";
                
                const logoHtml = item.icon 
                    ? `<img src="${item.icon}" alt="${item.name}" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.src='https://placehold.co/100x100/bae6fd/0369a1?text=Logo';">`
                    : `<i class="fa-solid fa-wallet text-sky-600 text-xl"></i>`;

                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-sky-200/40 to-transparent rounded-bl-full pointer-events-none"></div>
                    <div class="flex items-center space-x-4 mb-4">
                        <div class="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center border border-sky-100 flex-shrink-0 overflow-hidden group-hover:scale-105 transition-transform">
                            ${logoHtml}
                        </div>
                        <div class="flex-grow min-w-0">
                            <h2 class="font-bold text-slate-800 text-base truncate">${item.name}</h2>
                            <p class="text-xs text-slate-500 truncate mt-0.5"><i class="fa-regular fa-user mr-1 text-sky-400"></i> ${item.accountName}</p>
                        </div>
                    </div>
                    
                    <div class="bg-white/90 rounded-2xl p-3.5 flex items-center justify-between border border-sky-100/60 shadow-inner">
                        <div class="min-w-0 mr-2">
                            <span class="block text-[10px] text-slate-400 font-medium uppercase tracking-wider">เลขบัญชี / เบอร์โทร</span>
                            <span id="acc-num-${index}" class="text-base font-bold text-slate-700 tracking-wide font-mono">${item.accountNumber}</span>
                        </div>
                        <button onclick="copyToClipboard('${item.accountNumber}', '${item.name}')" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center space-x-1.5 flex-shrink-0">
                            <i class="fa-regular fa-copy"></i>
                            <span>คัดลอก</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Admin Management List
        function renderAdminPaymentList() {
            const container = document.getElementById('admin-payment-list');
            container.innerHTML = '';

            if (paymentMethods.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">ยังไม่มีข้อมูลช่องทางชำระเงิน</p>`;
                return;
            }

            paymentMethods.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-3 rounded-2xl bg-white border border-slate-100 shadow-sm text-xs";
                
                const thumbHtml = item.icon
                    ? `<img src="${item.icon}" class="w-8 h-8 rounded-xl object-contain bg-sky-50 p-0.5 border border-sky-100" onerror="this.src='https://placehold.co/100x100/bae6fd/0369a1?text=Logo'">`
                    : `<div class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center"><i class="fa-solid fa-wallet"></i></div>`;

                row.innerHTML = `
                    <div class="flex items-center space-x-3 min-w-0">
                        ${thumbHtml}
                        <div class="min-w-0">
                            <p class="font-semibold text-slate-800 truncate">${item.name}</p>
                            <p class="text-slate-400 font-mono text-[11px]">${item.accountNumber}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 flex-shrink-0">
                        <button onclick="toggleActive(${index})" class="px-2.5 py-1 rounded-lg font-medium text-[10px] ${item.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                            ${item.active ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}
                        </button>
                        <button onclick="editPaymentMethod(${index})" class="p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg transition-all" title="แก้ไข">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deletePaymentMethod(${index})" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition-all" title="ลบ">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Copy Function with Fallback
        function copyToClipboard(text, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`คัดลอก ${label} สำเร็จแล้วค่ะ! ✨`);
                }).catch(() => {
                    fallbackCopy(text, label);
                });
            } else {
                fallbackCopy(text, label);
            }
        }

        function fallbackCopy(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`คัดลอก ${label} สำเร็จแล้วค่ะ! ✨`);
            } catch (err) {
                showToast("ไม่สามารถคัดลอกได้ กรุณาลองใหม่อีกครั้ง");
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification System
        function showToast(message) {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            messageEl.innerText = message;
            
            toast.classList.remove('translate-y-[-200%]');
            toast.classList.add('translate-y-0');

            setTimeout(() => {
                toast.classList.remove('translate-y-0');
                toast.classList.add('translate-y-[-200%]');
            }, 2500);
        }

        // Admin Modal Toggle
        function toggleAdminModal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
        }

        // Save or Update Payment Method
        function savePaymentMethod() {
            const name = document.getElementById('pay-name').value.trim();
            const icon = document.getElementById('pay-icon').value.trim();
            const accountName = document.getElementById('pay-acc-name').value.trim();
            const accountNumber = document.getElementById('pay-acc-num').value.trim();
            const editIndex = parseInt(document.getElementById('edit-index').value);

            if (!name || !accountNumber) {
                showToast("กรุณากรอกชื่อและเลขบัญชีให้ครบถ้วนด้วยนะคะ 📝");
                return;
            }

            if (editIndex >= 0) {
                // Update existing
                paymentMethods[editIndex].name = name;
                paymentMethods[editIndex].icon = icon;
                paymentMethods[editIndex].accountName = accountName;
                paymentMethods[editIndex].accountNumber = accountNumber;
                showToast("อัปเดตช่องทางชำระเงินเรียบร้อยแล้วค่ะ!");
            } else {
                // Add new
                paymentMethods.push({
                    name,
                    icon,
                    accountName: accountName || storeInfo.name,
                    accountNumber,
                    active: true
                });
                showToast("เพิ่มช่องทางชำระเงินใหม่สำเร็จแล้วค่ะ!");
            }

            localStorage.setItem('nonnon_payment_methods', JSON.stringify(paymentMethods));
            renderFrontPaymentList();
            renderAdminPaymentList();
            resetForm();
        }

        // Edit Payment Method
        function editPaymentMethod(index) {
            const item = paymentMethods[index];
            document.getElementById('pay-name').value = item.name;
            document.getElementById('pay-icon').value = item.icon || '';
            document.getElementById('pay-acc-name').value = item.accountName;
            document.getElementById('pay-acc-num').value = item.accountNumber;
            document.getElementById('edit-index').value = index;

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square mr-1.5 text-sky-600"></i> แก้ไขช่องทาง: ${item.name}`;
            document.getElementById('save-btn-text').innerText = "บันทึกการแก้ไข";
        }

        // Delete Payment Method
        function deletePaymentMethod(index) {
            if (confirm("คุณต้องการลบช่องทางนี้ใช่หรือไม่?")) {
                paymentMethods.splice(index, 1);
                localStorage.setItem('nonnon_payment_methods', JSON.stringify(paymentMethods));
                renderFrontPaymentList();
                renderAdminPaymentList();
                showToast("ลบเรียบร้อยแล้วค่ะ");
            }
        }

        // Toggle Active Status
        function toggleActive(index) {
            paymentMethods[index].active = !paymentMethods[index].active;
            localStorage.setItem('nonnon_payment_methods', JSON.stringify(paymentMethods));
            renderFrontPaymentList();
            renderAdminPaymentList();
            showToast(`เปลี่ยนสถานะเป็น ${paymentMethods[index].active ? 'เปิดใช้งาน' : 'ปิดใช้งาน'} แล้ว`);
        }

        // Reset Form
        function resetForm() {
            document.getElementById('pay-name').value = '';
            document.getElementById('pay-icon').value = '';
            document.getElementById('pay-acc-name').value = '';
            document.getElementById('pay-acc-num').value = '';
            document.getElementById('edit-index').value = -1;
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-circle-plus mr-1.5 text-sky-600"></i> เพิ่มช่องทางชำระเงินใหม่`;
            document.getElementById('save-btn-text').innerText = "บันทึกช่องทางนี้";
        }

        // Reset to Default Data
        function resetToDefaultData() {
            if (confirm("ต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้นหรือไม่?")) {
                storeInfo = defaultStoreInfo;
                paymentMethods = defaultPaymentMethods;
                localStorage.setItem('nonnon_store_info', JSON.stringify(storeInfo));
                localStorage.setItem('nonnon_payment_methods', JSON.stringify(paymentMethods));
                renderStoreInfo();
                renderFrontPaymentList();
                renderAdminPaymentList();
                showToast("รีเซ็ตข้อมูลเรียบร้อยแล้วค่ะ!");
            }
        }
    </script>
</body>
</html>
